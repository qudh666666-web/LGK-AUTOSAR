[package]
name = "lgk-autosar"
version = "0.4.2"
edition = "2021"
description = "Open-source local bridge for licensed Vector DaVinci ECUC projects"
license = "MIT"
readme = "README.md"
repository = "https://github.com/qudh666666-web/LGK-AUTOSAR"
keywords = ["autosar", "ecuc", "davinci", "vector"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "lgk_autosar"
path = "src/lib.rs"

[[bin]]
name = "lgk-autosar"
path = "src/bin/lgk-autosar.rs"

[[bin]]
name = "lgk-autosar-host"
path = "src/bin/lgk-autosar-host.rs"

[dependencies]
anyhow = "1.0"
rand = "0.9"
regex = "1.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.5"
xmltree = "0.11"

[dev-dependencies]
tempfile = "3.20"

[profile.release]
strip = false
panic = "abort"
